name: Deploy Next.js App (Zarvantrip)

on:
  push:
    branches:
      - zarvantrip

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy on Zarvantrip Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP_ZARVANTRIP }}
          username: ${{ secrets.SERVER_USER_ZARVANTRIP }}
          port: 22 # 👈 اگر پورت سرور چیز دیگری است حتما اینجا عوض کنید
          key: ${{ secrets.SSH_PRIVATE_KEY_ZARVANTRIP }}
          timeout: 120s # افزایش مهلت اتصال شبکه
          command_timeout: 30m # مهلت برای فرآیند بیلد داکر
          script: |
            echo "🚀 Connected to Zarvantrip server"

            cd /var/safarnameh24-front

            NEW_TAG=$(date +%s)

            echo "🔧 Pulling latest code..."
            git pull

            echo "🔧 Building new Docker image..."
            docker build -t zarvantripfront:$NEW_TAG .

            echo "🛑 Stopping old container..."
            docker stop zarvantripfront_old || true
            docker rm zarvantripfront_old || true

            echo "🚀 Starting new container on port 3000..."
            docker run -d --name zarvantripfront_old -p 3000:3000 --restart always zarvantripfront:$NEW_TAG

            echo "⏳ Waiting for health check..."
            sleep 10

            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ New version healthy"
            else
              echo "❌ New version unhealthy"
              exit 1
            fi

            echo "🧼 Cleaning old images..."
            docker image prune -f || true

            echo "✨ Deployment completed successfully!"