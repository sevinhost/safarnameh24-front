name: Deploy Next.js App (safarnameh 24)

on:
  push:
    branches:
      - safarnameh 24

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy on safarnameh 24 Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: 22 # 👈 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s # افزایش مهلت اتصال شبکه
          command_timeout: 30m # مهلت برای فرآیند بیلد داکر
          script: |
            echo "🚀 Connected to safarnameh 24 server"

            cd /var/www/safarnameh24-front

            NEW_TAG=$(date +%s)

            echo "🔧 Pulling latest code..."
            git pull

            echo "🔧 Building new Docker image..."
            docker build -t safarnameh 24front:$NEW_TAG .

            echo "🛑 Stopping old container..."
            docker stop safarnameh 24front_old || true
            docker rm safarnameh 24front_old || true

            echo "🚀 Starting new container on port 3000..."
            docker run -d --name safarnameh 24front_old -p 3000:3000 --restart always safarnameh 24front:$NEW_TAG

            echo "⏳ Waiting for health check..."
            sleep 10

            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ New version healthy"
            else
              echo "❌ New version unhealthy"
              exit 1
            fi

            echo "🧼 Cleaning old images..."
            docker image prune -f || true

            echo "✨ Deployment completed successfully!"
